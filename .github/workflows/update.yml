# Moves the crate to each new Binaryen release: every day (and
# when run by hand), it looks for a release tag newer than the one the `binaryen` submodule pins.
# When there is one, `prepare` runs scripts/update-binaryen.sh and hands on the release's tag and
# the regenerated bindings; `push` writes the update from them (the submodule at the
# release, the bindings, the version `<N>.0.0`) and pushes it as a commit to the branch
# `update-binaryen`, never over a person's commits there; `test` runs CI on that commit, on the
# three OSes; and `release` fast-forwards main to it, tags it `v<N>.0.0` and deletes the branch.
# A failure anywhere leaves main as it was. Only the jobs that push hold a token that may write,
# and they run no third-party code.
name: Update Binaryen

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-binaryen
  cancel-in-progress: false

# bash with `-eo pipefail`: a failing command fails its step, in a pipe too.
defaults:
  run:
    shell: bash

jobs:
  # Builds and runs third-party code (bindgen-cli and its dependencies), so it can't write: its
  # result goes to `push` as outputs.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.result.outputs.tag }}
      bindings: ${{ steps.result.outputs.bindings }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          submodules: true
          persist-credentials: false

      - run: cargo install bindgen-cli --version 0.73.2 --locked

      - run: scripts/update-binaryen.sh

      # The whole bindings file, compressed and base64-encoded to fit in an output: `push`
      # writes it to its one path, so nothing `prepare` hands on can touch another file.
      - id: result
        run: |
          if git diff --quiet; then
            echo "Binaryen is up to date."
            exit 0
          fi
          tag="$(git -C binaryen describe --tags --exact-match)"
          bindings="$(gzip --best < src/bindings.rs | base64 --wrap=0)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "bindings=$bindings" >> "$GITHUB_OUTPUT"

  # Writes the update from `prepare`'s outputs alone, with git and the toolchain's cargo: the
  # tag checked to name a newer release, the submodule set to the commit Binaryen's repository
  # tags with it, the bindings written to src/bindings.rs, the version. A branch
  # `update-binaryen` holding a person's commits (a fix of a release that broke the update,
  # README.md) is never overwritten: the run fails, and the person finishes the update. One
  # holding only this workflow's commits (a run whose tests failed) is replaced, with a lease, so
  # a commit pushed meanwhile isn't lost either.
  push:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
      version: ${{ steps.commit.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - id: commit
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          BINDINGS: ${{ needs.prepare.outputs.bindings }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$TAG" =~ ^version_([0-9]+)$ ]]; then
            echo "::error::not a Binaryen release tag: $TAG"
            exit 1
          fi
          release="${BASH_REMATCH[1]}"
          current="$(sed --quiet 's/^version = "\([0-9]*\)\..*"$/\1/p' Cargo.toml | head --lines=1)"
          if [[ -z "$current" || -z "$BINDINGS" ]]; then
            echo "::error::no crate version in Cargo.toml, or no bindings from prepare"
            exit 1
          fi
          if (( release <= current )); then
            echo "::error::$TAG isn't newer than the crate's Binaryen $current"
            exit 1
          fi
          # The tag's commit: the peeled line of an annotated tag comes last.
          binaryen="$(git ls-remote https://github.com/WebAssembly/binaryen.git \
            "refs/tags/$TAG" "refs/tags/$TAG^{}" | tail --lines=1 | cut --fields=1)"
          if [[ -z "$binaryen" ]]; then
            echo "::error::WebAssembly/binaryen has no tag $TAG"
            exit 1
          fi
          git update-index --cacheinfo "160000,$binaryen,binaryen"
          base64 --decode <<< "$BINDINGS" | gunzip > src/bindings.rs
          version="$release.0.0"
          sed --in-place "0,/^version = .*/s//version = \"$version\"/" Cargo.toml
          cargo update --workspace --quiet
          git add src/bindings.rs Cargo.toml Cargo.lock

          bot='41898282+github-actions[bot]@users.noreply.github.com'
          remote="https://github.com/$GITHUB_REPOSITORY.git"
          lease="$(git ls-remote "$remote" refs/heads/update-binaryen | cut --fields=1)"
          if [[ -n "$lease" ]]; then
            git fetch --quiet "$remote" refs/heads/update-binaryen
            while read -r author committer; do
              if [[ "$author" != "$bot" || "$committer" != "$bot" ]]; then
                echo "::error::update-binaryen holds a person's commits: finish that update by hand (README.md)."
                exit 1
              fi
            done < <(git log --format='%ae %ce' "HEAD..FETCH_HEAD")
          fi

          git config user.name 'github-actions[bot]'
          git config user.email "$bot"
          git commit --quiet --message "BUILD: Binaryen $TAG"
          git push --force-with-lease="refs/heads/update-binaryen:$lease" \
            "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git" \
            HEAD:refs/heads/update-binaryen
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    needs: push
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.push.outputs.commit }}

  release:
    needs: [push, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.push.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      # A plain push only fast-forwards, and `--atomic` pushes main and the tag together or not
      # at all: if main moved since `push`, nothing changes.
      - env:
          COMMIT: ${{ needs.push.outputs.commit }}
          TAG: v${{ needs.push.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git tag "$TAG" "$COMMIT"
          git push --atomic "$remote" "$COMMIT:refs/heads/main" "refs/tags/$TAG"
          git push "$remote" --delete update-binaryen
