# Moves the crate to each new Binaryen release: every day (and
# when run by hand), it looks for a release tag newer than the one the `binaryen` submodule pins.
# When there is one, `prepare` runs scripts/update-binaryen.sh (the submodule moved to the tag,
# the bindings regenerated, the version set to `<N>.0.0`) and pushes the result as a commit to the
# branch `update-binaryen` (never over a person's commits there); `test` runs CI on that commit,
# on the three OSes; and `release` fast-forwards main to it, tags it `v<N>.0.0` and deletes the
# branch. A failure anywhere leaves main as it was.
name: Update Binaryen

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-binaryen
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
      version: ${{ steps.commit.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          submodules: true

      - run: cargo install bindgen-cli --version 0.73.2 --locked

      - run: scripts/update-binaryen.sh

      # A branch `update-binaryen` holding commits of a person (a fix of a release that broke
      # the update, README.md) is never overwritten: the run fails, and the person finishes the
      # update. One holding only this workflow's commits (a run whose tests failed) is replaced,
      # with a lease, so a commit pushed meanwhile isn't lost either.
      - id: commit
        run: |
          if git diff --quiet; then
            echo "Binaryen is up to date."
            exit 0
          fi
          bot='41898282+github-actions[bot]@users.noreply.github.com'
          remote="https://github.com/$GITHUB_REPOSITORY.git"
          base="$(git rev-parse HEAD)"
          lease="$(git ls-remote "$remote" refs/heads/update-binaryen | cut --fields=1)"
          if [[ -n "$lease" ]]; then
            git fetch --quiet "$remote" refs/heads/update-binaryen
            while read -r author; do
              if [[ "$author" != "$bot" ]]; then
                echo "::error::update-binaryen holds a person's commits: finish that update by hand (README.md)."
                exit 1
              fi
            done < <(git log --format=%ae "$base..FETCH_HEAD")
          fi
          tag="$(git -C binaryen describe --tags --exact-match)"
          version="$(sed --quiet 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head --lines=1)"
          git config user.name 'github-actions[bot]'
          git config user.email "$bot"
          git commit --quiet --all --message "BUILD: Binaryen $tag"
          git push --force-with-lease="refs/heads/update-binaryen:$lease" origin \
            HEAD:refs/heads/update-binaryen
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    needs: prepare
    if: needs.prepare.outputs.commit != ''
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}

  release:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0

      # A plain push only fast-forwards, and `--atomic` pushes main and the tag together or not
      # at all: if main moved since `prepare`, nothing changes.
      - env:
          COMMIT: ${{ needs.prepare.outputs.commit }}
          TAG: v${{ needs.prepare.outputs.version }}
        run: |
          git tag "$TAG" "$COMMIT"
          git push --atomic origin "$COMMIT:refs/heads/main" "refs/tags/$TAG"
          git push origin --delete update-binaryen
