# Moves the crate to each new Binaryen release: every day (and
# when run by hand), it looks for a release tag newer than the one vendored in binaryen/. When
# there is one, `prepare` runs scripts/update-binaryen.sh and hands on the release's tag and the
# regenerated bindings; `push` writes the update itself from them (the release's sources vendored
# by scripts/vendor-binaryen.sh, the bindings, the version `<N>.0.0`) and pushes it as a commit to
# the branch `update-binaryen`, never over a person's commits there; `test` runs CI on that
# commit, on the three OSes, which fails when the release needs a change of the crate (among its
# checks, scripts/check-c-api.sh); `release` fast-forwards main to it, tags it `v<N>.0.0` and
# deletes the branch; and `publish` starts the release workflow on the tag, which publishes the
# version on crates.io. A failure before `release` leaves main, the tags and crates.io as they
# were, and the next run tries again; on every run, `republish` starts the release workflow again
# on each tagged version that crates.io lacks. Only the steps that push or start a workflow hold
# a token that may change the repository, and their jobs run no third-party code. On every run,
# `keepalive` re-enables the scheduled workflows through the API (its token may only manage
# Actions), to keep GitHub from pausing their schedules for inactivity (README.md).
name: Update Binaryen

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-binaryen
  cancel-in-progress: false

# bash with `-eo pipefail`: a failing command fails its step, in a pipe too.
defaults:
  run:
    shell: bash

jobs:
  # Re-enables the scheduled workflows (this one and the dependency checks), which they are
  # already, through the REST API: GitHub disables a public repository's scheduled workflows after
  # 60 days without activity in the repository, and this is the commit-free way to keep the
  # schedules going that projects report working; GitHub doesn't document which activity resets
  # the 60 days (README.md). Its token may only manage Actions.
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in update.yml dependencies.yml; do
            gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/enable"
          done

  # Builds and runs third-party code (bindgen-cli and its dependencies), so it can't write: its
  # result goes to `push` as outputs.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.result.outputs.tag }}
      bindings: ${{ steps.result.outputs.bindings }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - run: cargo install bindgen-cli --version 0.73.2 --locked

      - run: scripts/update-binaryen.sh

      # The whole bindings file, compressed and base64-encoded to fit in an output: `push`
      # writes it to its one path, so nothing `prepare` hands on can touch another file.
      - id: result
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Binaryen is up to date."
            exit 0
          fi
          tag="$(sed --quiet 's/^tag //p' binaryen-release)"
          bindings="$(gzip --best < src/bindings.rs | base64 --wrap=0)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "bindings=$bindings" >> "$GITHUB_OUTPUT"

  # Writes the update from `prepare`'s outputs alone, with this repository's scripts, git and the
  # toolchain's cargo: the tag checked to name a newer release, the release's sources vendored
  # from Binaryen's repository, the bindings written to src/bindings.rs, the version. A branch
  # `update-binaryen` holding a person's commits (a fix of a release that broke the update,
  # README.md) is never overwritten: the run fails, and the person finishes the update. One
  # holding only this workflow's commits (a run whose tests failed) is replaced, with a lease, so
  # a commit pushed meanwhile isn't lost either. Only the last step holds the token.
  push:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
      version: ${{ steps.commit.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - id: commit
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          BINDINGS: ${{ needs.prepare.outputs.bindings }}
        run: |
          if [[ ! "$TAG" =~ ^version_([0-9]+)$ ]]; then
            echo "::error::not a Binaryen release tag: $TAG"
            exit 1
          fi
          release="${BASH_REMATCH[1]}"
          current="$(sed --quiet 's/^version = "\([0-9]*\)\..*"$/\1/p' Cargo.toml | head --lines=1)"
          if [[ -z "$current" || -z "$BINDINGS" ]]; then
            echo "::error::no crate version in Cargo.toml, or no bindings from prepare"
            exit 1
          fi
          if (( release <= current )); then
            echo "::error::$TAG isn't newer than the crate's Binaryen $current"
            exit 1
          fi
          scripts/vendor-binaryen.sh "$TAG"
          base64 --decode <<< "$BINDINGS" | gunzip > src/bindings.rs
          version="$release.0.0"
          sed --in-place "0,/^version = .*/s//version = \"$version\"/" Cargo.toml
          cargo update --workspace --quiet
          git add --all binaryen binaryen-release src/bindings.rs Cargo.toml Cargo.lock

          bot='41898282+github-actions[bot]@users.noreply.github.com'
          remote="https://github.com/$GITHUB_REPOSITORY.git"
          lease="$(git ls-remote "$remote" refs/heads/update-binaryen | cut --fields=1)"
          if [[ -n "$lease" ]]; then
            git fetch --quiet "$remote" refs/heads/update-binaryen
            while read -r author committer; do
              if [[ "$author" != "$bot" || "$committer" != "$bot" ]]; then
                echo "::error::update-binaryen holds a person's commits: finish that update by hand (README.md)."
                exit 1
              fi
            done < <(git log --format='%ae %ce' "HEAD..FETCH_HEAD")
          fi

          git config user.name 'github-actions[bot]'
          git config user.email "$bot"
          git commit --quiet --message "BUILD: Binaryen $TAG"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "lease=$lease" >> "$GITHUB_OUTPUT"

      - env:
          LEASE: ${{ steps.commit.outputs.lease }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git push --force-with-lease="refs/heads/update-binaryen:$LEASE" \
            "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git" \
            HEAD:refs/heads/update-binaryen

  test:
    needs: push
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.push.outputs.commit }}

  release:
    needs: [push, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.push.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      # A plain push only fast-forwards, and `--atomic` pushes main and the tag together or not
      # at all: if main moved since `push`, nothing changes.
      - env:
          COMMIT: ${{ needs.push.outputs.commit }}
          TAG: v${{ needs.push.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git tag "$TAG" "$COMMIT"
          git push --atomic "$remote" "$COMMIT:refs/heads/main" "refs/tags/$TAG"
          git push "$remote" --delete update-binaryen

  # Starts the release workflow on the new tag: a tag pushed with this workflow's token starts
  # none by itself. Its token may only manage Actions.
  publish:
    needs: [push, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          TAG: v${{ needs.push.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"

  # Starts the release workflow again on each tagged version of main that crates.io lacks (a
  # release run that failed after the tag, while crates.io was down for instance), from the
  # crate's first version on crates.io (the older tags were never meant for it; the first version
  # is published by hand), so that every tagged version gets published without a person. A run
  # that starts one fails, so that a person hears of it: a release that keeps failing makes every
  # run fail until a person fixes it. A tag whose release run is still going is left to it. Its
  # token may only manage Actions, in the step that uses it.
  republish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - id: unpublished
        run: |
          versions="$(scripts/crates-io-versions.sh)"
          if [[ -z "$versions" ]]; then
            echo "crates.io has no version of the crate yet: the first one is published by hand."
            exit 0
          fi
          first="$(head --lines=1 <<< "$versions")"
          git tag --merged HEAD --list 'v*' > "$RUNNER_TEMP/tags"
          unpublished=()
          while read -r tag; do
            version="${tag#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              continue
            fi
            oldest="$(printf '%s\n' "$first" "$version" | sort --version-sort | head --lines=1)"
            if [[ "$oldest" != "$first" ]] || grep --quiet --fixed-strings --line-regexp "$version" <<< "$versions"; then
              continue
            fi
            unpublished+=("$tag")
          done < "$RUNNER_TEMP/tags"
          echo "tags=${unpublished[*]}" >> "$GITHUB_OUTPUT"

      - if: steps.unpublished.outputs.tags != ''
        env:
          TAGS: ${{ steps.unpublished.outputs.tags }}
          GH_TOKEN: ${{ github.token }}
        run: |
          started=()
          for tag in $TAGS; do
            running="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --branch "$tag" \
              --json status --jq '[.[] | select(.status != "completed")] | length')"
            if (( running > 0 )); then
              echo "$tag: a release run is still going."
              continue
            fi
            gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$tag"
            started+=("$tag")
          done
          if (( ${#started[@]} > 0 )); then
            echo "::error::tagged but not on crates.io: ${started[*]}; started the release workflow again on them"
            exit 1
          fi
