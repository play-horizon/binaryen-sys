# Builds Binaryen and runs the tests on Linux, Windows and macOS; on Linux, also checks that
# binaryen/ is exactly upstream's sources at the release binaryen-release names, that
# src/bindings.rs is exactly what scripts/regenerate-bindings.sh generates from them and covers
# the C API exactly (scripts/check-c-api.sh), the formatting, Clippy and the API docs; builds the
# crate from its package, as crates.io would serve it; and checks the dependencies with cargo-deny
# (deny.toml). Runs on pushes to main and on pull requests, and is called by the update workflow
# on the commit it prepared and by the release workflow on the tagged one (`ref`).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: The commit to check.
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Binaryen's build, reused while the toolchain, the build script and the vendored release
      # don't change.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/
          key: target-${{ runner.os }}-${{ hashFiles('binaryen-release', 'rust-toolchain.toml', 'Cargo.lock', 'build.rs') }}

      - run: cargo test --locked

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - run: scripts/vendor-binaryen.sh --check

      - run: cargo install bindgen-cli --version 0.73.2 --locked

      - run: scripts/regenerate-bindings.sh

      - run: git diff --exit-code src/bindings.rs

      - run: cargo fmt --check

      - run: cargo clippy --locked --all-targets -- --deny warnings

      - run: cargo doc --locked --no-deps

      - run: scripts/check-c-api.sh

  # Builds the crate from its package (`cargo package` builds what it packaged), which proves the
  # package holds everything the build needs, before a version is tagged.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - run: cargo package --locked

  # Vulnerabilities, licences, banned crates and sources of the dependencies (deny.toml), with
  # cargo-deny at a fixed version whose own dependencies Cargo checks against its Cargo.lock.
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - run: cargo install cargo-deny --version 0.22.0 --locked

      - run: cargo deny --locked check
