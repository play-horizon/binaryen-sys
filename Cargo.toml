# Raw bindings to the C API of Binaryen, built from the Binaryen release vendored in binaryen/
# (binaryen-release names it). The major version is that release's number (`version_133` is
# 133.0.0); the update workflow sets it, and our own fixes bump the minor or patch version
# (README.md).
[package]
name = "binaryen-sys-next"
version = "133.1.1"
edition = "2024"
rust-version = "1.99"
authors = ["Sergey Pepyakin <s.pepyakin@gmail.com>", "The binaryen-sys-next contributors"]
# The crate's code and Binaryen's, then what the vendored LLVM (DWARF support) carries (its own
# licence, the NCSA licence of its system interface code, Unicode's for ConvertUTF.cpp), then
# FP16's (README.md, "Origin and licence").
license = "Apache-2.0 AND Apache-2.0 WITH LLVM-exception AND NCSA AND Unicode-DFS-2015 AND MIT"
repository = "https://github.com/play-horizon/binaryen-sys-next"
description = "Raw bindings to the C API of Binaryen, the WebAssembly compiler and optimizer library"
categories = ["external-ffi-bindings"]
links = "binaryen"
publish = false
autotests = false

[build-dependencies]
cmake = "0.1.58"

[[test]]
name = "main"
path = "tests/main.rs"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
